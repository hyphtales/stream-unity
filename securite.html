<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sécurité — StreamUnity</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif;}
        body {background: linear-gradient(135deg, #2a1060, #1a0840); color: white; min-height: 100vh; padding: 20px;}
        .conteneur {max-width: 500px; margin: 40px auto; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 15px; border: 2px solid #5533aa;}
        h2 {text-align: center; margin-bottom: 25px; color: #a970ff;}
        .groupe {margin-bottom: 20px;}
        label {display: block; margin-bottom: 8px; color: #ccc;}
        input {width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #5533aa; background: rgba(0,0,0,0.3); color: white; font-size: 16px;}
        button {width: 100%; padding: 12px; background: #9147ff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; margin-top: 10px;}
        button:hover {background: #a970ff; transform: translateY(-2px);}
        .retour {display: block; text-align: center; color: #9147ff; margin-top: 20px; text-decoration: none;}
        .message {margin-top: 15px; padding: 10px; border-radius: 8px; text-align: center; display: none;}
        .succes {background: rgba(0,200,100,0.2); color: #00ff88; display: block !important;}
        .erreur {background: rgba(255,50,50,0.2); color: #ff6666; display: block !important;}
    </style>
</head>
<body>

<div class="conteneur">
    <h2>🔒 Changer mon mot de passe</h2>

    <div class="groupe">
        <label>Ancien mot de passe</label>
        <input type="password" id="ancienMdp" placeholder="Tape ton mot de passe actuel">
    </div>

    <div class="groupe">
        <label>Nouveau mot de passe</label>
        <input type="password" id="nouveauMdp1" placeholder="Choisis un nouveau mot de passe">
    </div>

    <div class="groupe">
        <label>Confirmer le nouveau mot de passe</label>
        <input type="password" id="nouveauMdp2" placeholder="Répète le nouveau mot de passe">
    </div>

    <button onclick="changerMotDePasse()">✅ Enregistrer le nouveau mot de passe</button>

    <div id="message" class="message"></div>

    <a href="parametres.html" class="retour">← Retour aux Paramètres</a>
</div>

<div class="conteneur" style="margin-top: 30px;">
    <h2>❓ Mot de passe oublié</h2>
    <p style="color:#aaa; text-align:center; margin-bottom:20px;">Tu as oublié ton mot de passe ? Réinitialise-le ici :</p>

    <div class="groupe">
        <label>Ton adresse e-mail</label>
        <input type="email" id="emailRecup" placeholder="ton@email.com">
    </div>

    <button onclick="reinitialiserMotDePasse()">📩 Recevoir un lien de réinitialisation</button>

    <div id="messageOubli" class="message"></div>
</div>

<script>
// === MOT DE PASSE PAR DÉFAUT ===
// Au premier accès, on crée un mot de passe par défaut s'il n'y en a pas
if (!localStorage.getItem('mdpUtilisateur')) {
    localStorage.setItem('mdpUtilisateur', 'StreamUnity2026');
    localStorage.setItem('emailUtilisateur', 'mon@email.com');
}

// === CHANGER LE MOT DE PASSE ===
function changerMotDePasse() {
    const ancien = document.getElementById('ancienMdp').value;
    const nouveau1 = document.getElementById('nouveauMdp1').value;
    const nouveau2 = document.getElementById('nouveauMdp2').value;
    const message = document.getElementById('message');
    const mdpActuel = localStorage.getItem('mdpUtilisateur');

    if (ancien !== mdpActuel) {
        message.className = 'message erreur';
        message.textContent = "❌ L'ancien mot de passe est incorrect !";
        return;
    }

    if (nouveau1.length < 6) {
        message.className = 'message erreur';
        message.textContent = "❌ Le nouveau mot de passe doit faire au moins 6 caractères !";
        return;
    }

    if (nouveau1 !== nouveau2) {
        message.className = 'message erreur';
        message.textContent = "❌ Les deux nouveaux mots de passe ne correspondent pas !";
        return;
    }

    // ✅ TOUT EST BON → ON ENREGISTRE
    localStorage.setItem('mdpUtilisateur', nouveau1);
    message.className = 'message succes';
    message.textContent = "✅ Mot de passe changé avec succès !";

    // Efface les champs
    document.getElementById('ancienMdp').value = '';
    document.getElementById('nouveauMdp1').value = '';
    document.getElementById('nouveauMdp2').value = '';
}

// === MOT DE PASSE OUBLIÉ ===
function reinitialiserMotDePasse() {
    const email = document.getElementById('emailRecup').value;
    const message = document.getElementById('messageOubli');
    const emailEnregistre = localStorage.getItem('emailUtilisateur');

    if (!email) {
        message.className = 'message erreur';
        message.textContent = "❌ Saisis ton adresse e-mail !";
        return;
    }

    if (email !== emailEnregistre) {
        message.className = 'message erreur';
        message.textContent = "⚠️ Si cette adresse est la bonne, tu recevras un lien... (démonstration : l'e-mail est dans tes paramètres)";
        return;
    }

    // ✅ SIMULATION : Réinitialisation
    message.className = 'message succes';
    message.innerHTML = "✅ <strong>Mode démonstration :</strong> Ton nouveau mot de passe a été réinitialisé à : <code style='background:#000; padding:4px 8px; border-radius:4px;'>StreamUnity2026</code><br>Note-le bien !";
    localStorage.setItem('mdpUtilisateur', 'StreamUnity2026');
}
</script>

</body>
</html>
