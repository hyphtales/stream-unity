<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>StreamUnity - Abonnements</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {outline: none; box-sizing: border-box;}
        body {background: linear-gradient(135deg, #2a1060, #1a0840); color: white; font-family: sans-serif; margin: 0; padding: 0; min-height: 100vh;}
        .conteneur {max-width: 900px; margin: 30px auto; padding: 20px;}
        .entete {text-align: center; margin-bottom: 40px;}
        .entete img {width: 80px; height: 80px; border-radius: 50%;}
        .niveaux {display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap;}
        .btn-niveau {padding: 12px 25px; background: #2f2f35; border: none; color: #aaa; border-radius: 8px; cursor: pointer; font-size: 16px; transition: all 0.2s;}
        .btn-niveau.actif {background: linear-gradient(90deg, #772ce8, #9147ff); color: white; font-weight: bold;}
        .recherche {width: 100%; max-width: 400px; margin: 20px auto; display: block; padding: 10px 15px; background: #2a1060; border: 2px solid #5533aa; border-radius: 8px; color: white;}
        .case-anonyme {display: flex; align-items: center; gap: 10px; justify-content: center; margin: 15px 0; color: #ccc;}
        .grille-tarifs {display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0;}
        .carte-tarif {background: rgba(255,255,255,0.05); border: 2px solid transparent; border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; transition: all 0.2s;}
        .carte-tarif.actif {border-color: #9147ff; background: rgba(119,44,232,0.15); transform: scale(1.03);}
        .duree {font-size: 18px; color: #aaa; margin-bottom: 10px;}
        .prix {font-size: 36px; font-weight: bold; color: white;}
        .reduction {color: #28f074; font-size: 14px; margin-top: 5px;}
        .sous-total {text-align: center; font-size: 22px; margin: 20px 0;}
        .bouton-paiement {width: 100%; padding: 15px; background: linear-gradient(90deg, #772ce8, #9147ff); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.2s;}
        .bouton-paiement:hover {opacity: 0.9; transform: scale(1.01);}
        .bouton-paiement:disabled {opacity: 0.5; cursor: not-allowed; transform: none;}
        .lien-retour {text-align: center; margin-top: 30px;}
        .lien-retour a {color: #a970ff; text-decoration: none;}
        .message-info {text-align: center; margin-top: 15px; font-size: 14px; color: #ffcc00;}
    </style>
    <!-- 🔑 LIEN VERS STRIPE -->
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
    <div class="conteneur">
        <div class="entete">
            <img src="avatar.png" alt="StreamUnity">
            <h2>StreamUnity</h2>
            <p>Chaîne officielle ✅</p>
        </div>

        <div class="niveaux">
            <button class="btn-niveau" onclick="choisirNiveau(1)">Niveau 1</button>
            <button class="btn-niveau actif" onclick="choisirNiveau(2)">Niveau 2</button>
            <button class="btn-niveau" onclick="choisirNiveau(3)">Niveau 3</button>
        </div>

        <input type="text" class="recherche" placeholder="Chercher un utilisateur...">

        <label class="case-anonyme">
            <input type="checkbox"> Offrir de façon anonyme
        </label>

        <h3 style="text-align:center;">S'abonner 1 mois</h3>

        <div class="grille-tarifs">
            <div class="carte-tarif" onclick="choisirTarif(1)">
                <div class="duree">1 mois</div>
                <div class="prix" id="prix-1">7,99 €</div>
            </div>
            <div class="carte-tarif" onclick="choisirTarif(3)">
                <div class="duree">3 mois</div>
                <div class="prix">21,57 €</div>
                <div class="reduction">-10%</div>
            </div>
            <div class="carte-tarif" onclick="choisirTarif(6)">
                <div class="duree">6 mois</div>
                <div class="prix">47,94 €</div>
                <div class="reduction">-15%</div>
            </div>
        </div>

        <div class="sous-total">
            Sous-total : <span id="montant-affiche">7,99</span> €
        </div>

        <!-- 💳 BOUTON DE PAIEMENT STRIPE -->
        <button id="bouton-abonner" class="bouton-paiement" onclick="demanderPaiement()">
            💜 S'abonner au Niveau 2 — <span id="btn-montant">7,99</span> €
        </button>

        <p class="message-info" id="message-stripe">🔑 Clés Stripe à configurer pour activer le paiement</p>

        <div class="lien-retour">
            <a href="accueil.html">← Retour à l'accueil</a>
        </div>
    </div>

<script>
// ==========================================
// ⚙️ CONFIGURATION — TU REMPLACERAS ICI TES CLÉS PLUS TARD
// ==========================================
const CLE_PUBLIQUE_STRIPE = "pk_test_REMPLACEZ_ICI"; // ← Tu colles ta clé publique ici
let stripe = null;
let sessionPaiement = null;

// ==========================================
// 📊 TARIFS PAR NIVEAU
// ==========================================
const tarifs = {
    1: { 1: 4.99, 3: 13.47, 6: 29.94 },
    2: { 1: 7.99, 3: 21.57, 6: 47.94 },
    3: { 1: 14.99, 3: 40.47, 6: 89.94 }
};

let niveauActuel = 2;
let dureeActuelle = 1;

// ==========================================
// 🎯 CHOISIR LE NIVEAU
// ==========================================
function choisirNiveau(niv) {
    niveauActuel = niv;
    document.querySelectorAll('.btn-niveau').forEach((btn, i) => {
        btn.classList.toggle('actif', i + 1 === niv);
    });
    dureeActuelle = 1;
    mettreAJourAffichage();
}

// ==========================================
// 🎯 CHOISIR LA DURÉE
// ==========================================
function choisirTarif(mois) {
    dureeActuelle = mois;
    document.querySelectorAll('.carte-tarif').forEach((carte, i) => {
        carte.classList.toggle('actif', [1,3,6][i] === mois);
    });
    mettreAJourAffichage();
}

// ==========================================
// 🔄 METTRE À JOUR LES PRIX
// ==========================================
function mettreAJourAffichage() {
    const montant = tarifs[niveauActuel][dureeActuelle];
    document.getElementById('montant-affiche').textContent = montant.toFixed(2);
    document.getElementById('btn-montant').textContent = montant.toFixed(2);
}

// ==========================================
// 💳 LANCER LE PAIEMENT
// ==========================================
function demanderPaiement() {
    if (CLE_PUBLIQUE_STRIPE === "pk_test_REMPLACEZ_ICI") {
        alert("⚠️ Il faut d'abord configurer ta clé Stripe !\n\nVa dans Stripe → Développeurs → Clés API\nRemplace 'pk_test_REMPLACEZ_ICI' par ta vraie clé publique.");
        return;
    }

    if (!stripe) {
        stripe = Stripe(CLE_PUBLIQUE_STRIPE);
    }

    const montant = tarifs[niveauActuel][dureeActuelle];
    alert(`💳 Redirection vers le paiement sécurisé...\n\nNiveau ${niveauActuel} — ${dureeActuel} mois\nTotal : ${montant.toFixed(2)} €\n\n⚠️ Le système de paiement sera actif quand tu auras configuré tes clés API Stripe.`);
    
    // Quand tes clés seront configurées, on ajoutera ici la redirection vers Stripe Checkout
}
</script>
</body>
</html>
