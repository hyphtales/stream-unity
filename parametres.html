<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamUnity - Paramètres</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        * {outline: none; box-sizing: border-box; margin: 0; padding: 0;}
        body {background: linear-gradient(135deg, #2a1060, #1a0840); color: white; font-family: sans-serif; min-height: 100vh;}
        
        .menu {background: rgba(0,0,0,0.3); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100;}
        .menu a {display: inline-block; color: #ddd; text-decoration: none; padding: 10px 18px; margin: 0 5px; border-radius: 8px; transition: all 0.2s; font-size: 15px;}
        .menu a:hover, .menu a.actif {background: #9147ff; color: white; font-weight: bold;}
        
        .conteneur {max-width: 800px; margin: 30px auto; padding: 20px;}
        .entete {text-align: center; margin-bottom: 40px;}
        .entete h2 {font-size: 28px; color: #9147ff; margin-bottom: 5px;}
        .entete p {color: #aaa; font-size: 15px;}
        
        .carte-section {background: rgba(255,255,255,0.05); border-radius: 16px; padding: 25px; margin-bottom: 25px; border: 1px solid rgba(145,71,255,0.2);}
        .carte-section h3 {color: #9147ff; margin-bottom: 20px; font-size: 18px;}
        
        .plateforme {display: flex; align-items: center; justify-content: space-between; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 12px; transition: all 0.2s; border-left: 3px solid transparent;}
        .plateforme:hover {background: rgba(0,0,0,0.3); border-left-color: #9147ff;}
        .plateforme .info {display: flex; align-items: center; gap: 12px;}
        .plateforme .icone {font-size: 22px; width: 36px; text-align: center;}
        .plateforme .nom {font-weight: bold; font-size: 15px;}
        .plateforme .desc {font-size: 12px; color: #888; margin-top: 2px;}
        
        .profil {margin-top: 15px; padding: 15px; background: rgba(0,200,83,0.1); border-radius: 10px; display: none; border: 1px solid rgba(0,200,83,0.3);}
        .profil.visible {display: block; animation: apparition 0.4s ease-out;}
        @keyframes apparition {from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:none;}}
        .profil img {width: 60px; height: 60px; border-radius: 50%; margin-right: 15px; vertical-align: middle; border: 2px solid #00c853;}
        .profil .infos {display: inline-block; vertical-align: middle;}
        .profil .pseudo {font-weight: bold; font-size: 17px; color: #00c853;}
        .profil .email {font-size: 13px; color: #aaa; margin-top: 3px;}
        
        .btn-connecter {padding: 8px 18px; background: #772ce8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; font-size: 14px;}
        .btn-connecter:hover {background: #9147ff; transform: scale(1.03);}
        .btn-connecter.connecte {background: #00c853; cursor: default;}
        .btn-deconnecter {padding: 6px 12px; background: #e53935; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 10px;}
    </style>
</head>
<body>

    <nav class="menu">
        <a href="accueil.html">🏠 Accueil</a>
        <a href="stream.html">📺 Streams</a>
        <a href="salon.html">💬 Discussions</a>
        <a href="abonnements.html">💜 Abonnements</a>
        <a href="profil.html">👤 Profil</a>
        <a href="partenaire.html">🏅 Partenaires</a>
        <a href="parametres.html" class="actif">⚙️ Paramètres</a>
    </nav>

    <div class="conteneur">
        <div class="entete">
            <h2>⚙️ Paramètres</h2>
            <p>Gère tes connexions et tes informations</p>
        </div>

        <!-- 🟪 TWITCH - CONNEXION RÉELLE -->
        <div class="carte-section">
            <h3>🟪 Twitch</h3>
            <div class="plateforme">
                <div class="info">
                    <span class="icone">📱</span>
                    <div>
                        <div class="nom">Twitch</div>
                        <div class="desc">Abonnements, chaîne et statut</div>
                    </div>
                </div>
                <div>
                    <button id="btn-twitch" class="btn-connecter" onclick="connecterTwitch()">Connecter</button>
                </div>
            </div>

            <!-- ✅ ZONE PROFIL TWITCH -->
            <div id="profil-twitch" class="profil">
                <img id="twitch-avatar" src="" alt="Avatar Twitch" />
                <div class="infos">
                    <div class="pseudo">✅ <span id="twitch-pseudo"></span></div>
                    <div class="email" id="twitch-email"></div>
                </div>
                <button class="btn-deconnecter" onclick="deconnecterTwitch()">Se déconnecter</button>
            </div>
        </div>

        <!-- AUTRES PLATEFORMES -->
        <div class="carte-section">
            <h3>🎵 Autres plateformes</h3>
            <div class="plateforme">
                <div class="info">
                    <span class="icone">🎵</span>
                    <div>
                        <div class="nom">TikTok</div>
                        <div class="desc">Profil, vidéos et abonnés</div>
                    </div>
                </div>
                <button class="btn-connecter" onclick="alert('Twitch terminé d\\'abord ! 💜')">En attente...</button>
            </div>
            <div class="plateforme">
                <div class="info">
                    <span class="icone">🐦</span>
                    <div>
                        <div class="nom">X (Twitter)</div>
                        <div class="desc">Profil, tweets et abonnés</div>
                    </div>
                </div>
                <button class="btn-connecter" onclick="alert('Twitch terminé d\\'abord ! 💜')">En attente...</button>
            </div>
        </div>
    </div>

<script>
// ==========================================
// 🔑 TES CLÉS TWITCH
// ==========================================
const TWITCH_CLIENT_ID = "9a7yzs5amc2s6tkgt7a4pus3q8ufju";
const TWITCH_CLIENT_SECRET = "17xsStB1It2RmOpAfW11O4jQVMm54RVh2ZnsItk2Wd516";
const TWITCH_REDIRECT_URI = "https://stream-unity.onrender.com/parametres.html";

// ==========================================
// 🚀 AU CHARGEMENT DE LA PAGE
// ==========================================
window.onload = async function() {
    console.log("✅ Page chargée, recherche de code...");
    
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    
    if (code) {
        console.log("✅ Code reçu de Twitch :", code);
        await echangerCodeContreToken(code);
    } else {
        console.log("ℹ️ Aucun code détecté dans l'URL");
        verifierSessionTwitch();
    }
};

// ==========================================
// 🟪 OUVRIR LA CONNEXION TWITCH
// ==========================================
function connecterTwitch() {
    const url = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${encodeURIComponent(TWITCH_REDIRECT_URI)}&response_type=code&scope=user:read:email`;
    console.log("🔗 Ouverture connexion Twitch...");
    window.location.href = url;
}

// ==========================================
// 🔄 ÉCHANGER LE CODE CONTRE UN JETON
// ==========================================
async function echangerCodeContreToken(code) {
    try {
        console.log("🔄 Échange du code contre un jeton...");
        
        const corps = new URLSearchParams();
        corps.append("client_id", TWITCH_CLIENT_ID);
        corps.append("client_secret", TWITCH_CLIENT_SECRET);
        corps.append("code", code);
        corps.append("grant_type", "authorization_code");
        corps.append("redirect_uri", TWITCH_REDIRECT_URI);

        const reponse = await fetch("https://id.twitch.tv/oauth2/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: corps
        });

        const donnees = await reponse.json();
        console.log("📩 Réponse de Twitch :", donnees);

        if (donnees.access_token) {
            console.log("✅ Jeton obtenu !");
            // Sauvegarder le jeton
            localStorage.setItem("twitch_token", donnees.access_token);
            localStorage.setItem("twitch_refresh", donnees.refresh_token || "");
            await recupererProfilTwitch(donnees.access_token);
        } else {
            console.error("❌ Erreur jeton :", donnees);
            alert("Erreur : " + (donnees.message || JSON.stringify(donnees)));
            nettoyerUrl();
        }
    } catch (erreur) {
        console.error("❌ Erreur réseau :", erreur);
        alert("Problème : " + erreur.message);
        nettoyerUrl();
    }
}

// ==========================================
// 👤 RÉCUPÉRER ET AFFICHER LE PROFIL
// ==========================================
async function recupererProfilTwitch(jeton) {
    try {
        console.log("👤 Récupération du profil...");
        
        const reponse = await fetch("https://api.twitch.tv/helix/users", {
            headers: {
                "Authorization": `Bearer ${jeton}`,
                "Client-Id": TWITCH_CLIENT_ID
            }
        });

        const profil = await reponse.json();
        console.log("📩 Profil reçu :", profil);

        if (profil.data && profil.data.length > 0) {
            const utilisateur = profil.data[0];
            
            // ✅ Afficher le profil
            document.getElementById("twitch-pseudo").textContent = utilisateur.display_name;
            document.getElementById("twitch-avatar").src = utilisateur.profile_image_url;
            document.getElementById("twitch-email").textContent = utilisateur.email || "Email non disponible";
            document.getElementById("profil-twitch").classList.add("visible");
            
            // ✅ Bouton vert
            const bouton = document.getElementById("btn-twitch");
            bouton.textContent = "✅ Connecté";
            bouton.classList.add("connecte");

            // ✅ Sauvegarder l'ID utilisateur
            localStorage.setItem("twitch_id", utilisateur.id);
            localStorage.setItem("twitch_pseudo", utilisateur.display_name);
            
            // ✅ Nettoyer l'URL
            nettoyerUrl();
            console.log("✅ Profil affiché et sauvegardé !");
        } else {
            alert("Impossible de lire le profil.");
            nettoyerUrl();
        }
    } catch (erreur) {
        console.error("❌ Erreur profil :", erreur);
        alert("Erreur profil : " + erreur.message);
        nettoyerUrl();
    }
}

// ==========================================
// 🔄 VÉRIFIER SI DÉJÀ CONNECTÉ AU CHARGEMENT
// ==========================================
async function verifierSessionTwitch() {
    const jeton = localStorage.getItem("twitch_token");
    if (jeton) {
        console.log("✅ Session existante détectée");
        await recupererProfilTwitch(jeton);
    }
}

// ==========================================
// 🧹 NETTOYER L'URL
// ==========================================
function nettoyerUrl() {
    history.replaceState({}, document.title, TWITCH_REDIRECT_URI);
}

// ==========================================
// ❌ SE DÉCONNECTER
// ==========================================
function deconnecterTwitch() {
    localStorage.removeItem("twitch_token");
    localStorage.removeItem("twitch_refresh");
    localStorage.removeItem("twitch_id");
    localStorage.removeItem("twitch_pseudo");
    
    document.getElementById("profil-twitch").classList.remove("visible");
    const bouton = document.getElementById("btn-twitch");
    bouton.textContent = "Connecter";
    bouton.classList.remove("connecte");
    
    console.log("✅ Déconnecté de Twitch");
    alert("Tu es déconnecté de Twitch ✅");
}
</script>

</body>
</html>
