<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamUnity - Paramètres</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box;}
        body {
            background: linear-gradient(135deg, #2a1060, #1a0840);
            color: #efeff1;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }
        .menu {
            background: rgba(0,0,0,0.4);
            padding:14px;
            text-align:center;
            position:sticky;
            top:0;
            border-bottom:1px solid rgba(145,71,255,0.3);
        }
        .menu a {
            display:inline-block;
            color:#adadb8;
            text-decoration:none;
            padding:10px 16px;
            margin:0 4px;
            border-radius:6px;
            font-size:14px;
        }
        .menu a:hover, .menu a.actif {
            background:#9147ff;
            color:white;
        }
        .icone-flottante {
            position:fixed;
            right:20px;
            top:50%;
            transform:translateY(-50%);
            width:50px;
            height:50px;
            background:linear-gradient(135deg,#9147ff,#772ce8);
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
            color:white;
            text-decoration:none;
            z-index:9999;
        }
        .conteneur {
            max-width:600px;
            margin:40px auto;
            padding:30px;
            background:rgba(0,0,0,0.3);
            border-radius:12px;
            border:1px solid rgba(145,71,255,0.3);
        }
        .conteneur h1 {
            color:#9147ff;
            text-align:center;
            margin-bottom:30px;
        }
        .bloc {margin-bottom:25px;}
        label {display:block; margin-bottom:8px; font-weight:500;}
        select, button {
            width:100%;
            padding:12px;
            border-radius:6px;
            border:1px solid rgba(145,71,255,0.5);
            background:rgba(0,0,0,0.4);
            color:white;
            font-size:15px;
        }
        button {
            background:linear-gradient(135deg,#9147ff,#772ce8);
            border:none;
            cursor:pointer;
            font-weight:600;
            margin-top:10px;
        }
        button:hover {opacity:0.9;}
        .message {
            margin-top:15px;
            padding:10px;
            border-radius:6px;
            text-align:center;
            display:none;
        }
        .message.vert {background:rgba(0,180,0,0.2); color:#90ee90; display:block;}
    </style>
</head>
<body>

    <a href="accueil.html" class="icone-flottante" title="Retour à l'accueil">🏠</a>

        <a href="parametres.html" data-trad="menu_parametres" class="actif">⚙️ Paramètres</a>
    </nav>

    <div class="conteneur" id="langue">
        <h1 data-trad="titre_page">⚙️ Paramètres</h1>

        <div class="bloc">
            <label data-trad="choisir_langue">🌐 Choisis ta langue :</label>
            <select id="listeLangue">
                <option value="fr">🇫🇷 Français</option>
                <option value="en">🇬🇧 English</option>
                <option value="es">🇪🇸 Español</option>

                <option value="ru">🇷🇺 Русский</option>
                <option value="ja">🇯🇵 日本語</option>

function appliquerLangueGlobale() {
    const langue = localStorage.getItem('langueSite') || 'fr';
    document.getElementById('listeLangue').value = langue;
    const t = traductionsDispo[langue] || traductionsDispo.en;
    document.documentElement.lang = langue;
    document.querySelectorAll('[data-trad]').forEach(el => {
        const cle = el.getAttribute('data-trad');
        if (t[cle]) el.textContent = t[cle];
    });
}

function sauvegarderLangue() {
    const langue = document.getElementById('listeLangue').value;
    localStorage.setItem('langueSite', langue);
    const t = traductionsDispo[langue] || traductionsDispo.en;
    appliquerLangueGlobale();
    const msg = document.getElementById('confirmation');
    msg.textContent = t.confirme;
    msg.className = 'message vert';
    setTimeout(() => { msg.style.display = 'none'; }, 3000);
}

appliquerLangueGlobale();
</script>
