<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — StreamUnity</title>
    <style>
        /* === POLICES ET COULEURS GLOBALES === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4b0096, #2a0060);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* === 🎨 TROIS THÈMES — LIBRE CHOIX UTILISATEUR === */
        body.clair {
            background: linear-gradient(135deg, #f0efff, #dcd6ff);
            color: #2b1055;
        }
        body.sombre {
            background: linear-gradient(135deg, #18181b, #0f0f1a);
            color: #e0d6ff;
        }
        body.violet {
            background: linear-gradient(135deg, #4b0096, #2a0060);
            color: #ffffff;
        }

        /* === CADRE PRINCIPAL === */
        .cadre {
            width: 100%;
            max-width: 440px;
            background: rgba(20, 10, 40, 0.6);
            border-radius: 20px;
            padding: 40px 35px;
            border: 2px solid rgba(160, 110, 255, 0.35);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
        }

        /* === TITRES === */
        h1 {
            text-align: center;
            font-size: 32px;
            color: #c090ff;
            margin-bottom: 6px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .sous-titre {
            text-align: center;
            color: #b0a0d0;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* === ONGLETS === */
        .onglets {
            display: flex;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(120, 80, 200, 0.3);
        }
        .onglet {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #9080b0;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .onglet:hover {
            color: #d0b0ff;
            background: rgba(145, 71, 255, 0.08);
        }
        .onglet.actif {
            color: #e0d0ff;
            border-bottom: 3px solid #a060ff;
        }

        /* === FORMULAIRE === */
        .groupe {margin-bottom: 18px;}

        label {
            display: block;
            margin-bottom: 7px;
            color: #d0c0f0;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 2px solid rgba(110, 70, 180, 0.4);
            background: rgba(30, 15, 60, 0.5);
            color: #e0d8ff;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }
        input::placeholder {
            color: #8070a0;
        }
        input:focus {
            border-color: #b070ff;
            box-shadow: 0 0 0 3px rgba(160, 100, 255, 0.2);
        }

        /* === BOUTONS === */
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 8px;
        }
        .btn-principal {
            background: linear-gradient(135deg, #9050ff, #7030dd);
            color: #ffffff;
        }
        .btn-principal:hover {
            background: linear-gradient(135deg, #a060ff, #8040ee);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(145, 71, 255, 0.35);
        }
        .btn-google {
            background: #ffffff;
            color: #333333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
        }
        .btn-google:hover {background: #f5f5ff;}
        .btn-amazon {
            background: #ff9900;
            color: #1a1a1a;
            font-weight: 700;
        }
        .btn-amazon:hover {background: #ffad33;}
        .btn-apple {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
        }
        .btn-apple:hover {background: #f0f0f0;}

        /* === SÉPARATEUR === */
        .separateur {
            display: flex; align-items: center; gap: 12px; margin: 22px 0;
            color: #8070a0;
            font-size: 14px;
        }
        .separateur::before, .separateur::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(120, 90, 180, 0.4), transparent);
        }

        /* === LIENS === */
        .lien {
            text-align: center; margin-top: 20px; font-size: 14px;
        }
        .lien a {
            color: #c090ff;
            text-decoration: none;
            font-weight: 500;
        }
        .lien a:hover {
            color: #e0c0ff;
            text-decoration: underline;
        }

        /* === TITRE SECTION MOT DE PASSE OUBLIÉ === */
        h3 {
            color: #d0b0ff;
            font-size: 20px;
            margin-bottom: 12px;
        }

        /* === PARAGRAPHES === */
        p {
            color: #b0a0d0;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        /* === MESSAGES === */
        .message {
            margin-top: 18px; padding: 12px; border-radius: 10px; text-align: center;
            display: none; font-size: 14px; font-weight: 500;
        }
        .succes {
            background: rgba(0, 220, 100, 0.12);
            color: #80ffb0;
            display: block !important;
        }
        .erreur {
            background: rgba(255, 70, 70, 0.12);
            color: #ff9090;
            display: block !important;
        }

        .cache {display: none !important;}
    </style>
</head>
<body class="violet">

    <div class="cadre">
        <h1>StreamUnity</h1>
        <p class="sous-titre">Communauté & Streaming</p>

        <!-- ONGLETS -->
        <div class="onglets">
            <div class="onglet actif" onclick="changerOnglet('connexion')">Connexion</div>
            <div class="onglet" onclick="changerOnglet('inscription')">S'inscrire</div>
        </div>

        <!-- FORMULAIRE CONNEXION -->
        <div id="form-connexion">
            <div class="groupe">
                <label>E-mail ou identifiant</label>
                <input type="text" id="login-identifiant" placeholder="ton@email.com">
            </div>
            <div class="groupe">
                <label>Mot de passe</label>
                <input type="password" id="login-mdp" placeholder="Ton mot de passe">
            </div>

            <button class="btn btn-principal" onclick="seConnecter()">Se connecter</button>

            <div class="separateur">ou</div>

            <button class="btn btn-google" onclick="alert('🔵 Connexion avec Google en cours...')">
                🔵 Continuer avec Google
            </button>
            <button class="btn btn-amazon" onclick="alert('📦 Connexion avec Amazon en cours...')">
                📦 Continuer avec Amazon
            </button>
            <button class="btn btn-apple" onclick="alert('🍏 Connexion avec Apple en cours...')">
                🍏 Continuer avec Apple
            </button>

            <div class="lien">
                <a href="#" onclick="afficherMdpOublie(); return false;">Problèmes de connexion ?</a>
            </div>
        </div>

        <!-- FORMULAIRE MOT DE PASSE OUBLIÉ -->
        <div id="form-mdp-oublie" class="cache">
            <h3>Mot de passe oublié ?</h3>
            <p>Réinitialise ton mot de passe en choisissant une méthode :</p>

            <div style="margin-bottom:12px;">
                <label>📧 Par e-mail</label>
                <input type="email" id="recup-email" placeholder="ton@email.com">
                <button class="btn btn-principal" style="margin-top:8px;" onclick="envoyerEmail()">Envoyer le lien</button>
            </div>

            <div class="separateur">ou</div>

            <div>
                <label>📱 Par numéro de téléphone</label>
                <input type="tel" id="recup-tel" placeholder="+33 6 00 00 00 00">
                <button class="btn btn-principal" style="margin-top:8px;" onclick="envoyerSMS()">Envoyer le code par SMS</button>
            </div>

            <div class="lien" style="margin-top:20px;">
                <a href="#" onclick="retourConnexion(); return false;">← Retour à la connexion</a>
            </div>
        </div>

        <!-- MESSAGE -->
        <div id="message" class="message"></div>
    </div>

<script>
// === GESTION DES ONGLETS ===
function changerOnglet(nom) {
    document.querySelectorAll('.onglet').forEach(o => o.classList.remove('actif'));
    event.currentTarget.classList.add('actif');
    if (nom === 'inscription') {
        afficherMessage('📝 Inscription bientôt disponible !', 'succes');
    } else {
        cacherMessage();
    }
}

// === AFFICHER MOT DE PASSE OUBLIÉ ===
function afficherMdpOublie() {
    document.getElementById('form-connexion').classList.add('cache');
    document.getElementById('form-mdp-oublie').classList.remove('cache');
    cacherMessage();
}

// === RETOUR CONNEXION ===
function retourConnexion() {
    document.getElementById('form-mdp-oublie').classList.add('cache');
    document.getElementById('form-connexion').classList.remove('cache');
    cacherMessage();
}

// === SE CONNECTER ===
function seConnecter() {
    const identifiant = document.getElementById('login-identifiant').value;
    const mdp = document.getElementById('login-mdp').value;

    if (!identifiant || !mdp) {
        afficherMessage('⚠️ Remplis tous les champs !', 'erreur');
        return;
    }

    localStorage.setItem('utilisateurConnecte', identifiant);
    afficherMessage('✅ Connexion réussie ! Redirection...', 'succes');

    setTimeout(() => {
        window.location.href = 'accueil.html';
    }, 2000);
}

// === ENVOYER EMAIL ===
function envoyerEmail() {
    const email = document.getElementById('recup-email').value;
    if (!email) {
        afficherMessage('⚠️ Saisis ton adresse e-mail !', 'erreur');
        return;
    }
    afficherMessage('✅ Lien envoyé par e-mail ! Vérifie ta boîte de réception.', 'succes');
}

// === ENVOYER SMS ===
function envoyerSMS() {
    const tel = document.getElementById('recup-tel').value;
    if (!tel) {
        afficherMessage('⚠️ Saisis ton numéro de téléphone !', 'erreur');
        return;
    }
    afficherMessage('✅ Code envoyé par SMS !', 'succes');
}

// === AFFICHER / CACHER MESSAGE ===
function afficherMessage(texte, type) {
    const msg = document.getElementById('message');
    msg.textContent = texte;
    msg.className = 'message ' + type;
}
function cacherMessage() {
    document.getElementById('message').className = 'message';
}

// === 🎨 CHARGER AUTOMATIQUEMENT LE THÈME CHOISI PAR L'UTILISATEUR ===
window.onload = function() {
    // Si l'utilisateur a choisi un thème sur une autre page → il s'applique ICI aussi !
    if (localStorage.getItem('themeChoisi')) {
        const theme = localStorage.getItem('themeChoisi');
        document.body.className = theme;
    }
}
</script>

</body>
</html>
